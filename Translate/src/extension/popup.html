<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>网页对照翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>网页对照翻译</h1>
  <div class="actions">
    <button type="button" id="translate" disabled>翻译当前页</button>
    <button type="button" id="restore" disabled>恢复网页</button>
  </div>
  <label class="toggle"><input type="checkbox" id="translation" checked disabled> 显示中文译文</label>
  <label class="toggle"><input type="checkbox" id="original" checked disabled> 显示正文英文</label>
  <p id="status" role="status">正在读取当前网页…</p>
  <script src="popup.js"></script>
</body>
</html>
